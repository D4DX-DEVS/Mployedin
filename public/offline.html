<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>You're Offline — MPLOYEDIN</title>
    <meta name="theme-color" content="#3b82f6" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --muted-bg: #f1f5f9;
        --primary: #3b82f6;
        --primary-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --muted-bg: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
        text-align: center;
      }
      .wrap { max-width: 28rem; margin: 0 auto; }
      .icon {
        width: 6rem;
        height: 6rem;
        margin: 0 auto 1.5rem;
        border-radius: 9999px;
        background: var(--muted-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 1rem; }
      p { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" x2="22" y1="2" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <line x1="12" x2="12.01" y1="20" y2="20" />
        </svg>
      </div>
      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Please check your network settings and try again.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
