                - paragraph [ref=e713]: "Job Title: UI/UX Designer Location: Kozhikode, India Industry: Technology Salary: ₹40,000 per month About the Role MPLOYEDIN is looking for a creative and detail-oriented UI/UX Designer to join our growing team in Kozhikode. You will be responsible for defining the user experience and visual direction of our digital products, ensuring they are intuitive, accessible, and aesthetically engaging. Key Responsibilities Conduct end-to-end user research to understand pain points and user needs. Translate complex requirements into user flows, wireframes, and high-fidelity prototypes. Design clean, modern interfaces that align with brand guidelines and industry best practices. Collaborate closely with product managers and developers to ensure seamless hand-off and implementation. Iterate on designs based on user feedback, usability testing, and performance data. Required Qualifications Proven experience as a UI/UX Designer or similar role, with a strong portfolio showcasing web or mobile applications. Expert proficiency in industry-standard design tools: Figma, Adobe XD, and Sketch. Solid understanding of user-centered design principles, information architecture, and interaction design. Strong communication and collaboration skills to articulate design decisions effectively. Ability to work in a fast-paced environment and manage deadlines efficiently. Why Join Us? Impactful Work: Your designs will directly influence how users interact with our global platforms. Collaborative Culture: Work alongside a passionate, forward-thinking team in the heart of Kozhikode’s thriving tech community. Professional Growth: We value internal innovation and provide opportunities to lead design projects. Competitive Package: A stable, market-aligned salary of ₹40,000 per month, complemented by a supportive work environment. How to Apply: Are you ready to craft exceptional digital experiences? Send your resume and portfolio link to [Insert Email/Application Portal] with the subject line: \"UI/UX Designer Application – [Your Name]\". MPLOYEDIN is an equal opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all employees."
